<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2fa76a">
    <title>Offline — Batang Surigaonon Scholar's App</title>
    <style>
        :root { --green: #2fa76a; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #f6f8fb;
            color: #1f2937;
        }
        .card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border: 1px solid #eef3f6;
            border-radius: 16px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 6px 18px rgba(24, 39, 75, 0.06);
        }
        img {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 12px;
        }
        h1 { margin: 0 0 8px; font-size: 22px; }
        p { margin: 0 0 20px; color: #8a8f98; line-height: 1.5; }
        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 10px 18px;
            border-radius: 8px;
            background: var(--green);
            color: #fff;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <main class="card">
        <img src="/images/bssa-logo.png" alt="Batang Surigaonon">
        <h1>You are offline</h1>
        <p>An internet connection is required to use Batang Surigaonon Scholar's App. Reconnect, then try again. Nothing was saved while you were offline.</p>
        <a href="/">Try again</a>
    </main>
</body>
</html>
